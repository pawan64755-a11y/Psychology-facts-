<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Generator</title>
<style>
  :root{
    --bg:#EDE7DC;
    --ink:#1E1B16;
    --accent:#B08968;
    --panel:#F7F3EA;
    --line:#D8CFBE;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Georgia', 'Times New Roman', serif;
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:32px 16px 64px;
  }
  h1{
    font-size:1.4rem;
    letter-spacing:0.5px;
    margin:0 0 4px;
  }
  .sub{
    color:#6b6152;
    font-size:0.9rem;
    margin-bottom:28px;
    text-align:center;
  }
  .layout{
    width:100%;
    max-width:1040px;
    display:grid;
    grid-template-columns:360px 1fr;
    gap:28px;
  }
  @media (max-width:820px){
    .layout{grid-template-columns:1fr;}
    .preview-wrap{
      order:-1;
      position:sticky;
      top:0;
      z-index:10;
      background:var(--panel);
      padding-top:14px;
      padding-bottom:10px;
      box-shadow:0 4px 14px rgba(0,0,0,0.12);
    }
    canvas{max-width:340px;}
  }
  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:20px;
  }
  label{
    display:block;
    font-size:0.78rem;
    text-transform:uppercase;
    letter-spacing:0.8px;
    color:#8a7f6a;
    margin:16px 0 6px;
  }
  label:first-child{margin-top:0;}
  textarea{
    width:100%;
    min-height:110px;
    padding:10px;
    font-family:inherit;
    font-size:0.95rem;
    border:1px solid var(--line);
    border-radius:6px;
    resize:vertical;
    background:#fff;
  }
  input[type=text]{
    width:100%;
    padding:9px 10px;
    font-family:inherit;
    font-size:0.9rem;
    border:1px solid var(--line);
    border-radius:6px;
    background:#fff;
  }
  .row{display:flex; gap:10px;}
  .row > div{flex:1;}
  .swatches{display:flex; gap:8px; flex-wrap:wrap;}
  .swatch{
    width:34px; height:34px; border-radius:50%;
    border:2px solid transparent;
    cursor:pointer;
  }
  .swatch.active{border-color:var(--ink);}
  select{
    width:100%;
    padding:9px 10px;
    font-family:inherit;
    font-size:0.9rem;
    border:1px solid var(--line);
    border-radius:6px;
    background:#fff;
  }
  .toggle-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:16px;
  }
  .toggle-row label{margin:0;}
  button{
    margin-top:22px;
    width:100%;
    padding:13px;
    border:none;
    border-radius:6px;
    background:var(--ink);
    color:#fff;
    font-family:inherit;
    font-size:0.95rem;
    letter-spacing:0.4px;
    cursor:pointer;
  }
  button:hover{opacity:0.9;}
  button.secondary{
    background:transparent;
    color:var(--ink);
    border:1px solid var(--ink);
    margin-top:10px;
  }
  .preview-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
  }
  canvas{
    width:100%;
    max-width:480px;
    border-radius:10px;
    box-shadow:0 6px 24px rgba(0,0,0,0.15);
  }
  .hint{
    font-size:0.78rem;
    color:#8a7f6a;
    line-height:1.4;
  }
  input[type=range]{
    width:100%;
    accent-color:var(--accent);
  }
  .style-preview{
    display:flex;
    align-items:center;
    justify-content:center;
    height:44px;
    border-radius:6px;
    border:1px solid var(--line);
    font-size:0.82rem;
    letter-spacing:0.3px;
  }
  .size-row{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .size-row input[type=range]{flex:1;}
  .size-btn{
    margin:0 !important;
    width:38px;
    min-width:38px;
    padding:8px 0 !important;
    font-size:1.1rem;
    line-height:1;
  }
  .size-value{
    font-size:0.85rem;
    color:var(--ink);
    min-width:48px;
    text-align:right;
  }
</style>
</head>
<body>

<h1>Psychology Fact Image</h1>
<div class="sub">Fact likho, style choose karo, aur ready-made image download karo.</div>

<div class="layout">

  <div class="panel">
    <label for="factText">Psychology Fact</label>
    <textarea id="factText" placeholder="Yaha apna psychology fact likhein...">Text_here</textarea>

    <label>Background + Text Style</label>
    <div class="style-preview" id="stylePreview">
      <span id="styleName">Style 1 / 30</span>
    </div>
    <button type="button" id="shuffleBtn" class="secondary" style="margin-top:10px;">🔀 Shuffle Style</button>

    <div id="customSizeWrap">
      <label>Adjust Size</label>
      <div class="size-row">
        <button type="button" id="sizeMinus" class="secondary size-btn">−</button>
        <input type="range" id="fontSizeSlider" min="20" max="140" value="60">
        <button type="button" id="sizePlus" class="secondary size-btn">+</button>
        <span class="size-value" id="fontSizeValue">60px</span>
      </div>
    </div>

    <button id="downloadBtn" class="secondary">Download PNG</button>
  </div>

  <div class="panel preview-wrap">
    <canvas id="canvas" width="1080" height="1080"></canvas>
  </div>

</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const SIZE = 1080;

// 30 curated background + text + highlight combinations
const stylePresets = [
  { name:'Paper Cream',        bg1:'#EFE9DC', bg2:'#E4DCC9', ink:'#1E1B16', hl:'#F2E48A' },
  { name:'Linen Grey',         bg1:'#E8E6E1', bg2:'#D9D6CF', ink:'#26241F', hl:'#F4B6C2' },
  { name:'Kraft Brown',        bg1:'#D9C3A0', bg2:'#C7AC80', ink:'#2B1F14', hl:'#B8E0D2' },
  { name:'Midnight Ink',       bg1:'#181614', bg2:'#0F0E0C', ink:'#F4F0E8', hl:'#F2E48A' },
  { name:'Rosewood Dusk',      bg1:'#2B1B1F', bg2:'#1A0F12', ink:'#F3E6E4', hl:'#E8A0A0' },
  { name:'Sage Whisper',       bg1:'#DDE5D8', bg2:'#C7D3BF', ink:'#26301F', hl:'#F4B6C2' },
  { name:'Dusty Blush',        bg1:'#F0DCD6', bg2:'#E3C4BB', ink:'#3A241E', hl:'#C9D6EA' },
  { name:'Slate Blue Night',   bg1:'#1B2430', bg2:'#10161E', ink:'#EDE9DF', hl:'#E8C4A0' },
  { name:'Terracotta Warm',    bg1:'#E3B08C', bg2:'#CE9066', ink:'#2B1710', hl:'#F2E48A' },
  { name:'Charcoal Rose',      bg1:'#211C1E', bg2:'#150F11', ink:'#F2E7E4', hl:'#E8A0A0' },
  { name:'Ivory Sand',         bg1:'#F5EFE2', bg2:'#E9DFC8', ink:'#1E1B16', hl:'#B8E0D2' },
  { name:'Plum Twilight',      bg1:'#2A1F2E', bg2:'#190F1D', ink:'#EFE4EE', hl:'#F2E48A' },
  { name:'Sea Mist',           bg1:'#DCE7E4', bg2:'#C4D6D1', ink:'#17251F', hl:'#E8C4A0' },
  { name:'Blush Cream',        bg1:'#F3E3DD', bg2:'#E7CFC5', ink:'#2E1E1B', hl:'#C9D6EA' },
  { name:'Deep Forest',        bg1:'#16211A', bg2:'#0D1510', ink:'#E8EDE6', hl:'#E8C4A0' },
  { name:'Warm Grey Editorial',bg1:'#E4E0D8', bg2:'#D2CCBE', ink:'#201D18', hl:'#F4B6C2' },
  { name:'Amber Dusk',         bg1:'#C98B4E', bg2:'#A96C33', ink:'#241207', hl:'#F4EAD5' },
  { name:'Navy Ink',           bg1:'#101826', bg2:'#070C15', ink:'#ECE9DF', hl:'#F2E48A' },
  { name:'Soft Lilac',         bg1:'#E7E1EE', bg2:'#D5CBE3', ink:'#251E2B', hl:'#E8A0A0' },
  { name:'Cocoa Cream',        bg1:'#E8D9C8', bg2:'#D6C0A5', ink:'#2B1D13', hl:'#B8E0D2' },
  { name:'Graphite Mint',      bg1:'#1D2420', bg2:'#131813', ink:'#E7EDE9', hl:'#B8E0D2' },
  { name:'Peach Paper',        bg1:'#F2DFCB', bg2:'#E6C8A9', ink:'#331F12', hl:'#C9D6EA' },
  { name:'Wine Velvet',        bg1:'#2C141B', bg2:'#1B0B10', ink:'#F1E4E6', hl:'#E8C4A0' },
  { name:'Stone Blue',         bg1:'#DDE2E6', bg2:'#C6CFD6', ink:'#1B222A', hl:'#E8A0A0' },
  { name:'Golden Kraft',       bg1:'#D6A85C', bg2:'#BE8B3C', ink:'#251804', hl:'#F4F0E8' },
  { name:'Ink Blot Grey',      bg1:'#201F1D', bg2:'#151412', ink:'#EDE9E1', hl:'#F4B6C2' },
  { name:'Rosy Linen',         bg1:'#ECDCD8', bg2:'#DEC3BD', ink:'#291B18', hl:'#B8E0D2' },
  { name:'Ocean Slate',        bg1:'#182B30', bg2:'#0E1B1F', ink:'#E4EDEE', hl:'#F2E48A' },
  { name:'Vanilla Bean',       bg1:'#F1E8D6', bg2:'#E2D3B2', ink:'#241C0F', hl:'#E8A0A0' },
  { name:'Espresso Night',     bg1:'#1C1410', bg2:'#110B08', ink:'#EFE5D8', hl:'#E8C4A0' }
];

let currentPresetIndex = 0;
let activeHighlight = stylePresets[0].hl;

function updateStyleLabel() {
  document.getElementById('styleName').textContent =
    stylePresets[currentPresetIndex].name + ' (' + (currentPresetIndex + 1) + '/' + stylePresets.length + ')';
}

function shuffleStyle() {
  let next;
  do {
    next = Math.floor(Math.random() * stylePresets.length);
  } while (next === currentPresetIndex && stylePresets.length > 1);
  currentPresetIndex = next;
  activeHighlight = stylePresets[currentPresetIndex].hl;
  updateStyleLabel();
  generateImage();
}

document.getElementById('shuffleBtn').addEventListener('click', shuffleStyle);

function addNoise(ctx, w, h, intensity) {
  const imgData = ctx.getImageData(0, 0, w, h);
  const data = imgData.data;
  for (let i = 0; i < data.length; i += 4) {
    const n = (Math.random() - 0.5) * intensity;
    data[i]   += n;
    data[i+1] += n;
    data[i+2] += n;
  }
  ctx.putImageData(imgData, 0, 0);
}

function drawBackground(palette) {
  const grad = ctx.createLinearGradient(0, 0, SIZE, SIZE);
  grad.addColorStop(0, palette.bg1);
  grad.addColorStop(1, palette.bg2);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, SIZE, SIZE);
  addNoise(ctx, SIZE, SIZE, 10);
}

// Wrap text into lines that fit maxWidth, return array of {text, words:[{word, width}]}
function wrapText(ctx, text, maxWidth) {
  const words = text.split(/\s+/);
  const lines = [];
  let currentLine = [];
  let currentWidth = 0;
  const spaceWidth = ctx.measureText(' ').width;

  words.forEach(word => {
    const w = ctx.measureText(word).width;
    if (currentWidth + w + (currentLine.length > 0 ? spaceWidth : 0) > maxWidth && currentLine.length > 0) {
      lines.push(currentLine);
      currentLine = [word];
      currentWidth = w;
    } else {
      currentLine.push(word);
      currentWidth += w + (currentLine.length > 1 ? spaceWidth : 0);
    }
  });
  if (currentLine.length) lines.push(currentLine);
  return lines;
}

function findFontSizeAndLines(text, maxWidth, mode, customSize) {
  let fontSize;
  if (mode === 'small') fontSize = 46;
  else if (mode === 'medium') fontSize = 60;
  else if (mode === 'large') fontSize = 76;
  else if (mode === 'custom') fontSize = customSize || 60;
  else {
    // auto mode: start big, shrink until it fits within height budget
    fontSize = 84;
  }

  let lines;
  const maxHeight = 620; // vertical budget for text block
  while (fontSize > 28) {
    ctx.font = `bold ${fontSize}px Georgia, 'Times New Roman', serif`;
    lines = wrapText(ctx, text, maxWidth);
    const lineHeight = fontSize * 138 / 1000 * 1.0;
    const totalHeight = lines.length * fontSize * 1.35;
    if (totalHeight <= maxHeight || mode !== 'auto') break;
    fontSize -= 2;
  }
  ctx.font = `bold ${fontSize}px Georgia, 'Times New Roman', serif`;
  lines = wrapText(ctx, text, maxWidth);
  return { fontSize, lines };
}

function generateImage() {
  const rawText = document.getElementById('factText').value.trim() || 'Type a psychology fact...';
  const fontSizeMode = 'custom';
  const customSize = parseInt(document.getElementById('fontSizeSlider').value, 10);
  const textAlignMode = 'center';

  const palette = stylePresets[currentPresetIndex];
  drawBackground(palette);

  const maxWidth = SIZE - 260;
  const margin = (SIZE - maxWidth) / 2;
  const { fontSize, lines } = findFontSizeAndLines(rawText, maxWidth, fontSizeMode, customSize);
  const lineHeight = fontSize * 1.35;
  const totalHeight = lines.length * lineHeight;
  let startY = (SIZE - totalHeight) / 2 + fontSize * 0.75;

  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.font = `bold ${fontSize}px Georgia, 'Times New Roman', serif`;

  lines.forEach((lineWords, idx) => {
    const y = startY + idx * lineHeight;
    const lineText = lineWords.join(' ');
    const lineWidth = ctx.measureText(lineText).width;
    let x;
    if (textAlignMode === 'left') x = margin;
    else if (textAlignMode === 'right') x = SIZE - margin - lineWidth;
    else x = SIZE / 2 - lineWidth / 2;

    lineWords.forEach((word, wIdx) => {
      const wordWidth = ctx.measureText(word).width;
      const spaceWidth = ctx.measureText(' ').width;

      ctx.fillStyle = palette.ink;
      ctx.textAlign = 'left';
      ctx.fillText(word, x, y);
      ctx.textAlign = 'center';

      x += wordWidth + spaceWidth;
    });
  });

  // subtle credit / mark at bottom
  ctx.font = `14px Georgia, serif`;
  ctx.fillStyle = palette.ink;
  ctx.globalAlpha = 0.35;
  ctx.textAlign = 'center';
  ctx.fillText('AttractionCode', SIZE / 2, SIZE - 48);
  ctx.globalAlpha = 1;
}

// --- Live preview: regenerate instantly as user changes anything ---
document.getElementById('factText').addEventListener('input', generateImage);

const fontSizeSlider = document.getElementById('fontSizeSlider');
const fontSizeValue = document.getElementById('fontSizeValue');

fontSizeSlider.addEventListener('input', () => {
  fontSizeValue.textContent = fontSizeSlider.value + 'px';
  generateImage();
});

document.getElementById('sizeMinus').addEventListener('click', () => {
  fontSizeSlider.value = Math.max(20, parseInt(fontSizeSlider.value, 10) - 2);
  fontSizeValue.textContent = fontSizeSlider.value + 'px';
  generateImage();
});
document.getElementById('sizePlus').addEventListener('click', () => {
  fontSizeSlider.value = Math.min(140, parseInt(fontSizeSlider.value, 10) + 2);
  fontSizeValue.textContent = fontSizeSlider.value + 'px';
  generateImage();
});

document.getElementById('downloadBtn').addEventListener('click', () => {
  const link = document.createElement('a');
  link.download = 'psychology-fact.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
});

// generate once on load
updateStyleLabel();
generateImage();
</script>

</body>
    </html>
